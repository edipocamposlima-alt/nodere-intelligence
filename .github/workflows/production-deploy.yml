name: Deploy NODERE Backend Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  render:
    name: Render backend
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Render hook missing
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "::warning::Render deploy skipped. Configure RENDER_DEPLOY_HOOK_URL in GitHub Secrets."


